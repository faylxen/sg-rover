[project]
name = "mars-rovers"
version = "0.1.0"
description = "Simulation de rovers sur un plateau"
requires-python = ">=3.10,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pre-commit = "4.2.0"
ruff = "0.11.13"
pytest = "8.3.5"
pytest-cov = "6.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["models", "parser", "simulation", "rover"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
