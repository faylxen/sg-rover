repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
      - id: unit-tests
        name: Unit tests
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
